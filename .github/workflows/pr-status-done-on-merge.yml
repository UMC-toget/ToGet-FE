name: PR Status Done on Merge

# PR이 머지되면 status 라벨이 status:review/in-progress 등에 머문 채로 남는 문제가 있었습니다.
# (실제로 과거 PR 다수가 머지된 뒤에도 낡은 status 라벨을 달고 있는 게 발견됨)
# base 브랜치와 무관하게 PR이 머지될 때마다 낡은 status:* 라벨을 지우고 status:done을 붙입니다.
on:
  pull_request:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  set-status-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: status 라벨을 done으로 정리
        uses: actions/github-script@v7
        with:
          script: |
            const STATUS_LABELS = ['status:todo', 'status:in-progress', 'status:review', 'status:blocked']
            const pr = context.payload.pull_request
            const labelNames = pr.labels.map((l) => l.name)

            for (const staleStatus of labelNames.filter((l) => STATUS_LABELS.includes(l))) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                name: staleStatus,
              }).catch(() => {})
            }

            if (!labelNames.includes('status:done')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['status:done'],
              }).catch(() => {})
            }
