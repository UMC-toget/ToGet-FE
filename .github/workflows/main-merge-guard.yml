name: Main Merge Guard

# main으로의 PR은 반드시 dev 브랜치에서만 와야 합니다. feature/fix 브랜치를 main에 직접
# 머지하면(dev를 건너뜀), 나중에 그 머지를 되돌릴 때(revert) 그 브랜치가 우연히 함께
# 가져온 다른 기능들까지 전부 같이 삭제되는 사고가 날 수 있습니다 (실제로 발생했던 사례).
on:
  pull_request:
    branches: ['main']

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: head 브랜치가 dev인지 확인
        run: |
          if [ "${{ github.event.pull_request.head.ref }}" != "dev" ]; then
            echo "::error::main 대상 PR은 dev 브랜치에서만 생성할 수 있습니다. (현재 head: ${{ github.event.pull_request.head.ref }})"
            exit 1
          fi
          echo "head 브랜치가 dev로 확인되었습니다."
